name: Java API
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package
        run: mvn -B verify
        working-directory: backend
